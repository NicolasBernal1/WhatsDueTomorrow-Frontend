sonar.projectKey=NicolasBernal1_WhatsDueTomorrow-Frontend2
sonar.organization=wdt

# Analisis de CALIDAD (bugs, code smells, vulnerabilidades): revisa TODO src
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts

# CALCULO DE COVERAGE: solo exige cobertura en src/app, y dentro de eso
# excluye los archivos sueltos de la raiz de app/, y las carpetas models/ y common/
sonar.coverage.exclusions=\
  src/main.ts,\
  src/styles.scss,\
  src/index.html,\
  **/environments/**,\
  src/app/*.ts,\
  **/models/**,\
  **/*.dto.ts,\
  **/common/**

sonar.javascript.lcov.reportPaths=coverage/whats-due-tomorrow-frontend/lcov.info


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=WhatsDueTomorrow-Frontend
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
